name: Rebuild DuckDB catalog

on:
  push:
    branches: [main]
    paths:
      - "sql/**"
      - "build_catalog.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb>=1.5

      - name: Rebuild catalog
        run: python build_catalog.py

      - name: Commit catalog if changed
        run: |
          if ! git diff --quiet -- wise_rbdsuca.duckdb; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add wise_rbdsuca.duckdb
            git commit -m "chore: rebuild wise_rbdsuca.duckdb from sql/"
            git push
          else
            echo "Catalog unchanged, nothing to commit."
          fi
